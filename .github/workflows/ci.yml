name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore TextChunker.slnx

      - name: Build
        run: dotnet build TextChunker.slnx --no-restore -c Release

      # Best effort: HF tokenizer tests skip gracefully when the file is absent.
      - name: Fetch tokenizer
        continue-on-error: true
        shell: bash
        run: |
          curl -fL --retry 3 --output tokenizer.json.tmp \
            "https://huggingface.co/google/embeddinggemma-2/resolve/main/tokenizer.json" \
            && mv tokenizer.json.tmp tokenizer.json

      - name: Test
        run: dotnet test TextChunker.slnx --no-build -c Release
